<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple Hello World website" />
    <title>Hello World</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      .card {
        width: min(100%, 36rem);
        padding: clamp(2rem, 8vw, 5rem);
        text-align: center;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 1.5rem;
        box-shadow: 0 1.5rem 4rem rgb(30 41 59 / 12%);
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        line-height: 1;
        letter-spacing: -0.06em;
      }

      p {
        margin: 1.25rem 0 0;
        color: #64748b;
        font-size: 1.125rem;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="welcome-heading">
        <h1 id="welcome-heading">Hello, world!</h1>
        <p>Welcome to this simple website.</p>
      </section>
    </main>
  </body>
</html>
