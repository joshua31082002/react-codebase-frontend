services:
  app:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "4173:3000"
    environment:
      WATCHPACK_POLLING: "true"

volumes:
  node_modules:
