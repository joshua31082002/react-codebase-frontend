services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/healthdb
      SPRING_DATASOURCE_USERNAME: healthapp
      SPRING_DATASOURCE_PASSWORD: healthapp
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4173:8080"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: healthdb
      POSTGRES_USER: healthapp
      POSTGRES_PASSWORD: healthapp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthapp -d healthdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
