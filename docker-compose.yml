services:
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "4173:4173"
    environment:
      - CHOKIDAR_USEPOLLING=true
volumes:
  node_modules:
