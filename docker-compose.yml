services:
  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "4173:4173"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "4173"
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 4173"

volumes:
  node_modules:
