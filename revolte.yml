revolte:
  version: '1'
  project: FE-test-project
  appName: fe-test-app
  env:
    preview:
      services:
        rid_1:
          type: WEB_APP
          name: fe-test-app
          entryPoint: index.html
          properties:
            indexPage: index.html
            errorPage: index.html
            enableCdn: false
            variables:
              APP_ENV: development
              APP_VERSION: v1.0.0
              APP_API_SERVICE_BASEURL: https://dummyjson.com
    qa:
      branch: qa
      services:
        rid_1:
          type: WEB_APP
          name: fe-test-app
          entryPoint: index.html
          properties:
            indexPage: index.html
            errorPage: index.html
            enableCdn: false
    staging:
      branch: staging
      services:
        rid_1:
          type: WEB_APP
          name: fe-test-app
          entryPoint: index.html
          properties:
            indexPage: index.html
            errorPage: index.html
            enableCdn: false
    production:
      branch: main
      services:
        rid_1:
          type: WEB_APP
          name: fe-test-app
          entryPoint: index.html
          properties:
            indexPage: index.html
            errorPage: index.html
            enableCdn: false
