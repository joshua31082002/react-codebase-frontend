revolte:
  version: '1.0'
  project: FE-test-project
  appName: fe-test-app
  env:
    preview:
      services:
        rid_1:
          name: fe-test-app
          entryPoint: server.js
          type: WEB_SERVICE
          properties:
            health: /api/health
            port: 8080
            loadBalancerMode: shared
          specifications:
            cpu: 2
            memory: 2
            storage: 30
    qa:
      branch: qa
      services:
        rid_1:
          name: fe-test-app
          entryPoint: server.js
          type: WEB_SERVICE
          properties:
            health: /api/health
            port: 8080
            loadBalancerMode: shared
          specifications:
            cpu: 2
            memory: 2
            storage: 30
    staging:
      branch: staging
      services:
        rid_1:
          name: fe-test-app
          entryPoint: server.js
          type: WEB_SERVICE
          properties:
            health: /api/health
            port: 8080
            loadBalancerMode: shared
          specifications:
            cpu: 2
            memory: 2
            storage: 30
    production:
      branch: main
      services:
        rid_1:
          name: fe-test-app
          entryPoint: server.js
          type: WEB_SERVICE
          properties:
            health: /api/health
            port: 8080
            loadBalancerMode: shared
          specifications:
            cpu: 2
            memory: 2
            storage: 50
            autoScaling:
              replica:
                min: 1
                max: 3
