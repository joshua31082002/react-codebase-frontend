revolte:
  version: '1'
  project: FE-test-project
  appName: fe-test-app
  env:
    preview:
      services:
        rid_1:
          name: fe-test-app
          type: WEB_SERVICE
          entryPoint: server.js
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          properties:
            health: /health
            port: 8080
            loadBalancerMode: shared
    qa:
      branch: qa
      services:
        rid_1:
          name: fe-test-app
          type: WEB_SERVICE
          entryPoint: server.js
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          properties:
            health: /health
            port: 8080
            loadBalancerMode: shared
    staging:
      branch: staging
      services:
        rid_1:
          name: fe-test-app
          type: WEB_SERVICE
          entryPoint: server.js
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          properties:
            health: /health
            port: 8080
            loadBalancerMode: shared
    production:
      branch: main
      services:
        rid_1:
          name: fe-test-app
          type: WEB_SERVICE
          entryPoint: server.js
          specifications:
            cpu: 2
            memory: 2
            storage: 50
            autoScaling:
              replica:
                min: 1
                max: 3
          properties:
            health: /health
            port: 8080
            loadBalancerMode: shared
