<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A basic Hello World website" />
    <title>Hello World</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101827;
        color: #f8fafc;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: radial-gradient(circle at top, #1d4ed8 0, #101827 48%);
      }
      section { max-width: 42rem; text-align: center; }
      h1 { margin: 0; font-size: clamp(3rem, 10vw, 7rem); letter-spacing: -0.06em; }
      p { margin: 1rem 0 0; color: #bfdbfe; font-size: 1.125rem; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Hello, world!</h1>
        <p>A simple beginning for something great.</p>
      </section>
    </main>
  </body>
</html>
